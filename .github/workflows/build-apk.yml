name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'

      - name: Verify Node
        run: |
          node -v
          npm -v

      - name: Install Dependencies
        run: |
          npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Verify Capacitor Dependencies
        run: |
          npm list @capacitor/core @capacitor/android @capacitor/cli || npm install @capacitor/android@^8.4.2 --no-audit --no-fund

      - name: Build Web Application
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
        run: npm run build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Create Android Platform
        run: |
          rm -rf android
          npx cap add android

      - name: Generate & Inject Android App Icons
        run: |
          npm install sharp --no-save
          node scripts/generate-icons.js
          node scripts/generate-android-icons.js

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Read App Name
        run: |
          APP_NAME="Motorku"
          SAFE_NAME=$(echo "$APP_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
          echo "APP_NAME=$SAFE_NAME" >> $GITHUB_ENV

      - name: Rename APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK tidak ditemukan!"
            exit 1
          fi

          cp "$APK" "android/app/build/outputs/apk/${APP_NAME}.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP_NAME }}
          path: android/app/build/outputs/apk/${{ env.APP_NAME }}.apk
