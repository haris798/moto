<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Motor.ku - Jurnal Oli & BBM</title>

    <!-- PWA Meta Tags & Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="description" content="Aplikasi pelacak servis oli, bahan bakar (BBM), dan efisiensi sepeda motor dengan sinkronisasi cloud." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Motor.ku" />
    <link rel="apple-touch-icon" href="/pwa_icon_192.png" />
    <link rel="icon" type="image/png" href="/pwa_icon_192.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Service Worker Registration & Auto-Update -->
    <script>
      if ('serviceWorker' in navigator) {
        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });

        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => {
              console.log('Service Worker terdaftar:', reg.scope);
              
              // Check for update on load and when tab gets focus
              reg.update();
              document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                  reg.update();
                }
              });

              reg.addEventListener('updatefound', () => {
                const newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', () => {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            })
            .catch((err) => {
              console.error('Gagal mendaftarkan Service Worker:', err);
            });
        });
      }
    </script>
  </body>
</html>
